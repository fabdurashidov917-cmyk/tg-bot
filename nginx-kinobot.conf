    # ---------------- Kinobot webhook (@sizning_botingiz) ----------------
    # Himoya: maxfiy yo'l + Telegram ning X-Telegram-Bot-Api-Secret-Token sarlavhasi
    # (domen Cloudflare ortida, shuning uchun IP bo'yicha cheklov qo'yilmadi).
    location = /tg/MAXFIY_YOL {
        proxy_pass http://127.0.0.1:3180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
        access_log off;
    }
